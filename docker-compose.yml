version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: im_postgres
    environment:
      POSTGRES_DB: db_zj_60070
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123456
    ports:
      - "15070:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: im_redis
    ports:
      - "16370:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
